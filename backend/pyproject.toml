[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=24.1.0",
    "alembic>=1.18.4",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi-users>=15.0.5",
    "fastapi[standard]>=0.135.3",
    "langchain>=1.2.0",
    "langchain-experimental>=0.4.1",
    "langchain-text-splitters>=1.1.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pymupdf>=1.27.2.2",
    "qdrant-client>=1.17.1",
    "sqlalchemy[asyncio]>=2.0.49",
]

[project.optional-dependencies]
llm-ollama = [
    "langchain-ollama>=1.1.0",
]
llm-gemini = [
    "google-genai>=1.72.0",
    "langchain-google-genai>=4.2.1",
]
llm-vllm = [
    "langchain-openai>=1.1.12",
    "openai>=2.31.0",
]
embedding-vllm = [
    "langchain-openai>=1.1.12",
    "openai>=2.31.0",
]
embedding-sentence-transformers = [
    "langchain-huggingface>=1.2.1",
]
reranker-tei = [
    "numpy>=2.4.4",
    "requests>=2.33.1",
]
reranker-flag = [
    "sentence-transformers>=5.4.0",
]

[tool.ruff]
# Target your Python version
target-version = "py312"

[tool.ruff.lint]
# E/F are the basic errors; I handles import sorting (isort style)
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
