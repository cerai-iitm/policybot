services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost/policybot
      - NEXT_PUBLIC_API_PREFIX=api
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/next.config.ts

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: backend:dev
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - IN_DOCKER=${IN_DOCKER:-1}
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/policybot
      - LLM_PROVIDER=${LLM_PROVIDER:-vllm}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-vllm}
      - RERANKER_PROVIDER=${RERANKER_PROVIDER:-tei}
      - VLLM_LLM_PROXY_URL=${VLLM_LLM_PROXY_URL:-http://dev-proxy-nginx/vllm/}
      - VLLM_EMBEDDING_PROXY_URL=${VLLM_EMBEDDING_PROXY_URL:-http://dev-proxy-nginx/embedding/}
      - TEI_RERANKER_URL=${TEI_RERANKER_URL:-http://dev-proxy-nginx/reranker}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-policybot}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - RUN_MIGRATIONS=true
      - RUN_DEMO_SETUP=true
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/logs:/app/logs
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /app/backend/app
        - action: sync
          path: ./backend/api
          target: /app/backend/api
        - action: sync
          path: ./backend/db
          target: /app/backend/db
        - action: sync
          path: ./backend/providers
          target: /app/backend/providers
        - action: sync
          path: ./backend/services
          target: /app/backend/services
        - action: sync
          path: ./backend/core
          target: /app/backend/core
        - action: sync
          path: ./backend/.env
          target: /app/backend/.env
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/alembic.ini
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./backend/api/deps.py
        - action: sync
          path: ./backend/migrations
          target: /app/migrations
        - action: sync
          path: ./backend/demo_config.py
          target: /app/backend/demo_config.py
        - action: sync
          path: ./backend/setup_demo.py
          target: /app/backend/setup_demo.py
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    env_file:
      - backend/.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-policybot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 10s
      retries: 5

  qdrant:
    image: qdrant/qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__HTTP__PORT: 6333

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
