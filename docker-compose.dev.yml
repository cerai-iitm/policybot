services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: backend:dev
    env_file:
      - ./backend/.env
    environment:
      - IN_DOCKER=${IN_DOCKER:-1}
      - OLLAMA_IP=${OLLAMA_IP:-host.docker.internal}
      - OLLAMA_PORT=${OLLAMA_PORT:-11434}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-policybot}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - RUN_MIGRATIONS=true
      - HF_HOME=${HF_HOME:-/app/cache/huggingface}
    command:
      [
        "uvicorn",
        "src.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
        - action: sync
          path: ./backend/migrations
          target: /app/migrations
        - action: sync
          path: ./backend/populate_db.py
          target: /app/populate_db.py
        - action: rebuild
          path: ./backend/Dockerfile
        - action: rebuild
          path: ./backend/requirements.txt
        - action: rebuild
          path: ./backend/download_models.py
        - action: rebuild
          path: ./backend/entrypoint.sh
        - action: rebuild
          path: ./backend/alembic.ini
        - action: rebuild
          path: ./backend/pyproject.toml
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
