services:
  nginx:
    image: nginx:alpine
    ports:
      # Change if the port is already in use. "port_to_use:80"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - pdf_data:/var/www/pdf
    depends_on:
      - frontend
      - backend

  backend:
    build:
      context: ./backend
      target: production
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - IN_DOCKER=${IN_DOCKER:-1}
      - OLLAMA_IP=${OLLAMA_IP:-host.docker.internal}
      - OLLAMA_PORT=${OLLAMA_PORT:-11434}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      # Huggingface cache dir config
      - HF_HOME=${HF_HOME:-/app/cache/huggingface}
      # Use POSTGRES_* vars as the single source of truth for DB connection.
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-policybot}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - RUN_MIGRATIONS=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pdf_data:/app/data
      - huggingface_cache:/app/cache/huggingface
      - ./backend/logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  model_downloader:
    build:
      context: ./backend
      target: model_downloader
    environment:
      HF_HOME: ${HF_HOME:-/app/cache/huggingface}
    volumes:
      - huggingface_cache:/app/cache/huggingface
    restart: "no"

  frontend:
    build:
      context: ./frontend
      target: production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  postgres:
    image: postgres:17-alpine
    env_file:
      - backend/.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-policybot}
      # - PGDATA=/var/lib/postgresql/18/docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 10s
      retries: 5
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 512M

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333" # HTTP API
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__HTTP__PORT: 6333

  tei-reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:89-1.6
    container_name: tei-reranker
    profiles: ["prod"]
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - --model-id
      - BAAI/bge-reranker-base
      - --max-batch-tokens
      - "16384" # Standard default, safe for your 2.4GB slice
      - --max-client-batch-size
      - "32" # Allows you to send up to 32 paras at once
      - --auto-truncate # Automatically cuts paras to 512 tokens to avoid errors

  gemma-embedding:
    image: vllm/vllm-openai:latest
    container_name: vllm-embeddings
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "8081:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - HF_TOKEN=${HF_TOKEN}
    command: >
      --model google/embeddinggemma-300m
      --dtype auto
      --gpu-memory-utilization 0.1
      --max-model-len 2048

  gemma-llm:
    image: vllm/vllm-openai:latest
    container_name: vllm-gemma3n
    profiles: ["prod"]
    restart: unless-stopped
    ports:
      - "8080:8000"
    volumes:
      - ./template.jinja:/app/template.jinja
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - HF_TOKEN=${HF_TOKEN}
    command: >
      --model unsloth/gemma-3n-E4B-it
      --dtype auto
      --gpu-memory-utilization 0.7
      --max-model-len 32000
      --chat-template /app/template.jinja

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  pdf_data:
    driver: local
  huggingface_cache:
    name: policybot_huggingface_cache
    driver: local
