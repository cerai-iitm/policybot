services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - pdf_data:/var/www/pdf
    depends_on:
      backend:
        condition: service_started
    restart: on-failure

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production

    command: >
      sh -c "
      echo 'Waiting for postgres...';
      while ! nc -z postgres 5432; do
        sleep 1;
      done;
      echo 'Postgres started';
      python -m backend.app.main
      "  
    env_file:
      - ./backend/.env
    environment:
      - IN_DOCKER=${IN_DOCKER:-1}
      - OLLAMA_IP=${OLLAMA_IP:-host.docker.internal}
      - OLLAMA_PORT=${OLLAMA_PORT:-11434}
      - LLM_PROVIDER=${LLM_PROVIDER:-vllm}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-vllm}
      - RERANKER_PROVIDER=${RERANKER_PROVIDER:-tei}
      - VLLM_LLM_PROXY_URL=${VLLM_LLM_PROXY_URL:-http://dev-proxy-nginx/vllm/}
      - VLLM_EMBEDDING_PROXY_URL=${VLLM_EMBEDDING_PROXY_URL:-http://dev-proxy-nginx/embedding/}
      - TEI_RERANKER_URL=${TEI_RERANKER_URL:-http://dev-proxy-nginx/reranker}
      - HF_HOME=${HF_HOME:-/app/cache/huggingface}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-policybot}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - RUN_MIGRATIONS=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pdf_data:/app/data
      - ./backend/logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    depends_on:
      # Ensure PostgreSQL is healthy before backend starts
      postgres:
        condition: service_healthy
      # Qdrant only needs to be started, health check not required here
      qdrant:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    env_file:
      - backend/.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-policybot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 512M

  qdrant:
    image: qdrant/qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__HTTP__PORT: 6333

  tei-reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:89-1.6
    container_name: tei-reranker
    profiles: ["prod"]
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - --model-id
      - BAAI/bge-reranker-base
      - --max-batch-tokens
      - "16384"
      - --max-client-batch-size
      - "32"
      - --auto-truncate

  gemma-embedding:
    image: vllm/vllm-openai:latest
    container_name: vllm-embeddings
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "8081:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - HF_TOKEN=${HF_TOKEN}
    command: >
      --model google/embeddinggemma-300m
      --dtype auto
      --gpu-memory-utilization 0.1
      --max-model-len 2048

  gemma-llm:
    image: vllm/vllm-openai:latest
    container_name: vllm-gemma3n
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "8080:8000"
    volumes:
      - ./template.jinja:/app/template.jinja
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - HF_TOKEN=${HF_TOKEN}
    command: >
      --model unsloth/gemma-3n-E4B-it
      --dtype auto
      --gpu-memory-utilization 0.7
      --max-model-len 32000
      --chat-template /app/template.jinja

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  pdf_data:
    driver: local